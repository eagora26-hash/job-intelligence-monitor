<!doctype html>
<html>
<head>
  <title>Fiverr — Data Processing</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "item": {
          "@type": "Product",
          "name": "I will build a python web scraping bot",
          "url": "https://www.fiverr.com/sellerone/build-python-web-scraping-bot",
          "description": "Custom scraper with Selenium/Playwright.",
          "offers": {"@type": "Offer", "price": "120", "priceCurrency": "USD"}
        }
      },
      {
        "@type": "ListItem",
        "position": 2,
        "item": {
          "@type": "Product",
          "name": "I will automate your workflow with python",
          "url": "https://www.fiverr.com/sellertwo/automate-workflow-python",
          "description": "Workflow automation and API integration.",
          "offers": {"@type": "Offer", "price": "200", "priceCurrency": "USD"}
        }
      }
    ]
  }
  </script>
</head>
<body><div id="app">listing</div></body>
</html>
