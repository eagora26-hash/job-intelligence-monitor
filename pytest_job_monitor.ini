# Dedicated pytest config for the Job Intelligence Monitor test suite.
# Kept separate from the vendored Scrapling library's pytest.ini (which uses
# --doctest-modules and targets tests/{core,parser,...}).
# Run with:  pytest -c pytest_job_monitor.ini
[pytest]
testpaths = tests/job_monitor
addopts = -q
filterwarnings =
    ignore:.*strip_cdata.*:DeprecationWarning
    ignore:.*starlette.testclient.*
markers =
    network: tests that hit the live network (deselect with -m "not network")
